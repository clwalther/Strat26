<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Strategiespiel 2026 - Interface Blue</title>

	<link rel="icon" href="data:,">

	<script src="../interface.js" defer></script>

	<style>
		h2 {
			display: flex;
			justify-content: space-between;
		}

		article {
			display: flex;

			flex-wrap: wrap;
			gap: 16px;
		}

		section {
			flex: 1 0 calc(523.6px + 8px);
			width: calc(50% - 8px);

			display: grid;
			justify-items: center;
			align-content: start;
		}

		section>div {
			width: calc(100% - 64px);
			height: 80px;

			margin: 12px;
			padding: 16px;
			border: 2px dashed black;

			display: flex;
			justify-content: space-around;
		}

		#container-goalkeeper {
			width: 85px !important;
		}

		#container-bench {
			width: calc(100% - 2*16px - 2*12px) !important;
			height: auto !important;

			flex-wrap: wrap;
			gap: 12px;
		}
	</style>

	<style>
		.player {
			height: 70px;
			width: 75px;

			margin: 2px;
			border: 2px solid black;

			display: grid;

			align-content: space-evenly;
			justify-items: center;
			text-align: center;


			overflow: hidden;
			font-size: 13px;

			cursor: pointer;
		}

		.player.yellow {
			border-color: yellow;
			background-color: lightyellow;
		}

		.player.red {
			border-color: red;
			background-color: lightcoral;

			cursor: not-allowed;
		}

		.player>button {
			width: 45px;

			font-size: 12px;

		}
	</style>

	<style>
		dialog {
			height: 500px;
			width: 400px;

			align-content: end;
			align-items: baseline;

			grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
			gap: 16px;

			background:
				linear-gradient(#fff0 35%, #fff 50%),
				url(../assets/blue.png);
			background-position-x: center;
			background-position-y: 46px;
			background-size: contain;

			padding: 32px;

			text-wrap: nowrap;

			overflow: hidden;
		}

		body:has(dialog:is([open])) {
			overflow: hidden;
		}

		dialog:is([open]) {
			display: grid;
		}

		dialog>h2 {
			grid-column-end: span 8;
			text-align: center;

			margin-top: 126px;
		}

		dialog>input[type="number"]:nth-of-type(5) {
			grid-column-start: 5;
		}

		dialog>input[type="number"] {
			margin: 8px;
			height: 24px;
			width: 70px;

			grid-column-end: span 2;
		}

		dialog>label[type="number"] {
			grid-column-end: span 2;
		}

		dialog>button {
			height: 36px;
			grid-column-end: span 4;
		}
	</style>
</head>

<body>
	<h2>
		<div>
			Mannschaft <b style="color: blue">Blau</b> - Aufstellung <span
				id="span-line-up"><i>wirdgeladen...</i></span>
		</div>
		<div>
			<button id="button-dec">-</button>
			<span id="span-score">X</span>
			<button id="button-inc">+</button>
		</div>
	</h2>

	<article>
		<section class="line-up">
			<span>Sturm <span id="span-strikers"><i>wird geladen...</i></span></span>
			<div id="container-strikers" max="6"></div>
			<span>Mittelfeld <span id="span-midfielders"><i>wird geladen...</i></span></span>
			<div id="container-midfielders" max="6"></div>
			<span>Verteidigung <span id="span-defenders"><i>wird geladen...</i></span></span>
			<div id="container-defenders" max="6"></div>
			<span>Torwart <span id="span-goalkeeper"><i>wird geladen...</i></span></span>
			<div id="container-goalkeeper" max="1"></div>
		</section>

		<section class="reserve">
			<span>Auswechselbank <span id="span-bench"><i>wird geladen...</i></span></span>
			<div id="container-bench" max="26"></div>
		</section>
	</article>

	<div id="container-dialog"></div>
</body>

<script>
	const buttonDec = document.getElementById('button-dec');
	const spanScore = document.getElementById('span-score');
	const buttonInc = document.getElementById('button-inc');

	const containerStrikers = document.getElementById("container-strikers");
	const containerMidfielders = document.getElementById("container-midfielders");
	const containerDefenders = document.getElementById("container-defenders");
	const containerGoalkeeper = document.getElementById("container-goalkeeper");
	const containerBench = document.getElementById("container-bench");

	const containerDialog = document.getElementById("container-dialog");

	const spanLineUp = document.getElementById("span-line-up");
	const spanBench = document.getElementById("span-bench");
	const spanStrikers = document.getElementById("span-strikers");
	const spanGoalkeeper = document.getElementById("span-goalkeeper");
	const spanDefenders = document.getElementById("span-defenders");
	const spanMidfielders = document.getElementById("span-midfielders");
</script>

<script>
	const TEAM = "blau";
	let players;
	let score;

	async function update() {
		const respPlayers = await fetch("/api/players");
		const respScore = await fetch("/api/score");

		if (respPlayers.status == 200 && respScore.status == 200) {
			const dataPlayers = await respPlayers.json();
			const dataScore = await respScore.json();

			players = dataPlayers.players;
			score = dataScore.score[TEAM];

			resetDOM();

			spanScore.innerText = score;

			players.forEach(player => {
				if (player.team === TEAM) {
					let playerDialog = createPlayerDialog(player);
					let playerCard = createPlayerCard(player, playerDialog);

					containerDialog.appendChild(playerDialog);

					switch (player.role) {
						case "BENCH":
							containerBench.insertBefore(playerCard, containerBench.childNodes[player.position]);
							break;
						case "GOALKEEPER":
							containerGoalkeeper.insertBefore(playerCard, containerGoalkeeper.childNodes[player.position]);
							break;
						case "DEFENDERS":
							containerDefenders.insertBefore(playerCard, containerDefenders.childNodes[player.position]);
							break;
						case "MIDFIELDERS":
							containerMidfielders.insertBefore(playerCard, containerMidfielders.childNodes[player.position]);
							break;
						case "STRIKERS":
							containerStrikers.insertBefore(playerCard, containerStrikers.childNodes[player.position]);
							break;

						default:
							alert(`Player ${player.name} with role ${player.role} could not be sorted correctly.`);
							break;
					}
				}
			});
		} else {
			alert(`Packet to ${respPlayers.url} failed with status: ${respPlayers.status} ${respPlayers.statusText}`);
		}

		updateDOM();
	}

	function resetDOM() {
		spanScore.innerText = 'X';

		containerStrikers.innerHTML = "";
		containerMidfielders.innerHTML = "";
		containerDefenders.innerHTML = "";
		containerGoalkeeper.innerHTML = "";
		containerBench.innerHTML = "";
		containerDialog.innerHTML = "";

		spanBench.innerHTML = "<i>wird geladen...</i>";
		spanLineUp.innerHTML = "<i>wird geladen...</i>";
		spanGoalkeeper.innerHTML = "<i>wird geladen...</i>";
		spanDefenders.innerHTML = "<i>wird geladen...</i>";
		spanMidfielders.innerHTML = "<i>wird geladen...</i>";
		spanStrikers.innerHTML = "<i>wird geladen...</i>";
	}

	function updateDOM() {
		[
			[spanBench, containerBench],
			[spanGoalkeeper, containerGoalkeeper],
			[spanDefenders, containerDefenders],
			[spanMidfielders, containerMidfielders],
			[spanStrikers, containerStrikers]
		].forEach(tuple => {
			let span = tuple[0];
			let container = tuple[1];

			span.innerText = `(${container.querySelectorAll(":scope>.player").length}/${container.getAttribute("max")})`;
		});

		spanLineUp.innerText = `(${(
			containerGoalkeeper.querySelectorAll(":scope>.player").length
			+ containerDefenders.querySelectorAll(":scope>.player").length
			+ containerMidfielders.querySelectorAll(":scope>.player").length
			+ containerStrikers.querySelectorAll(":scope>.player").length)}/${getAllowedAmmount()})`;
	}

	update();
</script>

<script>
	[
		containerGoalkeeper,
		containerDefenders,
		containerMidfielders,
		containerStrikers,
		containerBench
	].forEach(container => {
		/* === DRAG OVER === */
		container.addEventListener("dragover", (e) => {
			let card = document.getElementById(e.dataTransfer.getData("text/plain"));

			if (container == card.parentElement || container == containerBench ||
				(containerBench != card.parentElement && container != card.parentElement && container.querySelectorAll(":scope>.player").length < parseInt(container.getAttribute("max"))) ||
				(containerBench == card.parentElement && container != card.parentElement && container.querySelectorAll(":scope>.player").length < parseInt(container.getAttribute("max")) && (
					containerGoalkeeper.querySelectorAll(":scope>.player").length
					+ containerDefenders.querySelectorAll(":scope>.player").length
					+ containerMidfielders.querySelectorAll(":scope>.player").length
					+ containerStrikers.querySelectorAll(":scope>.player").length) < getAllowedAmmount()))
				e.preventDefault();
		});

		/* === DROP === */
		container.addEventListener("drop", async (e) => {
			let card = document.getElementById(e.dataTransfer.getData("text/plain"));
			card.parentElement.removeChild(card);

			let i = 0;
			for (; i < container.childNodes.length; i++) {
				let rect = container.childNodes[i].getBoundingClientRect();

				if (e.clientX < rect.x + rect.width / 2 && e.clientY < rect.y + rect.height + 6) {
					break;
				}
			}

			container.insertBefore(card, container.childNodes[i]);

			let team = updateContiners();

			// post update to server
			resp = await fetch("/api/positions", {
				method: "POST",
				headers: {
					"Content-Type": "application/json"
				},
				body: JSON.stringify({
					"players": team
				})
			});

			if (resp.status == 200) {
				updateDOM();
			} else {
				alert(`Request to ${resp.url} failed with status: ${resp.status} ${resp.statusText}`);
			}

		})
	});

	buttonDec.addEventListener('click', async (_) => {
		resp = await fetch('/api/score', {
			method: 'POST',
			headers: {
				"Content-Type": "application/json"
			},
			body: JSON.stringify({
				'team': TEAM,
				"score": score - 1,
			})
		});

		if (resp.status == 200) {
			update();
		} else {
			alert(`Request to ${resp.url} failed with status: ${resp.status} ${resp.statusText}`);
		}
	})

	buttonInc.addEventListener('click', async (_) => {
		resp = await fetch('/api/score', {
			method: 'POST',
			headers: {
				"Content-Type": "application/json"
			},
			body: JSON.stringify({
				'team': TEAM,
				"score": score + 1,
			})
		});

		if (resp.status == 200) {
			update();
		} else {
			alert(`Request to ${resp.url} failed with status: ${resp.status} ${resp.statusText}`);
		}
	})
</script>

<script>
	function updateContiners() {
		let team = [];

		[
			[containerGoalkeeper, "GOALKEEPER"],
			[containerDefenders, "DEFENDERS"],
			[containerMidfielders, "MIDFIELDERS"],
			[containerStrikers, "STRIKERS"],
			[containerBench, "BENCH"],
		].forEach(tuple => {
			let container = tuple[0];
			let role = tuple[1];

			for (let i = 0; i < container.childNodes.length; i++) {
				for (let j = 0; j < players.length; j++) {
					if (container.childNodes[i].id == players[j].id) {
						players[j].role = role;
						players[j].position = i;

						team.push(players[j]);
					}
				}
			}
		});

		return team;
	}

	function getAllowedAmmount() {
		let ammount = 11;

		players.forEach(player => {
			if (player.team === TEAM && player.punishment_time > 0 &&
				(player.punishment == "RED" || player.punishment == "DOUBLE"))
				ammount--;
		});

		return ammount;
	}
</script>

</html>
