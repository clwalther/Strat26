<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Strategiespiel 2026 - Dashboard</title>

	<link rel="icon" href="data:,">

	<style>
		html {
			overflow: hidden;
			scrollbar-width: none;
		}

		body {
			height: calc(100vh - 16px);
			width: calc(100vw - 16px);

			display: flex;
			align-items: center;

			gap: 32px;

			overflow: hidden;

			background-color: green;
		}

		body>aside {
			flex: 0 1 25%;

			min-width: 375px;
			height: calc(100% - 10px);

			cursor: pointer;

			transition: flex 300ms ease, width 300ms ease, opacity 300ms ease;

			border: 5px dashed white;
		}

		body>article {
			display: grid;
			justify-items: center;
			align-items: center;

			flex: 1 1 50%;

			min-width: 500px;
			height: 100%;

			cursor: pointer;

			transition: flex 300ms ease, width 300ms ease;
		}

		body.focus-left #right {
			display: none;
		}

		body.focus-left #left {
			flex: 1 1 50%;
		}

		body.focus-left #center {
			flex: 1 1 50%;
		}

		body.focus-right #left {
			display: none;
		}

		body.focus-right #right {
			flex: 1 1 50%;
		}

		body.focus-right #center {
			flex: 1 1 50%;
		}

		body>aside>div {
			height: 100%;

			display: grid;
			justify-content: space-around;
			align-content: space-around;


			grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
			grid-auto-rows: minmax(80px, auto);
			justify-items: center;
			align-items: center;
		}

		body>article>section {
			width: 100%;

			background-image: url(../assets/pitch.jpg);
			background-position: center;
			background-size: contain;
			background-repeat: no-repeat;
		}

		body.focus-right>article>section {
			width: 200%;
			translate: -25%;
		}

		body.focus-left>article>section {
			width: 200%;
			translate: 25%;
		}

		body>article>section>div {
			display: none;
		}
	</style>


	<style>
		.player {
			height: 70px;
			width: 75px;

			margin: 2px;
			border: 2px solid black;

			display: grid;

			align-content: space-evenly;
			justify-items: center;
			text-align: center;


			overflow: hidden;
			font-size: 13px;
		}

		.player.yellow {
			border-color: yellow;
			background-color: lightyellow;
		}

		.player.red {
			border-color: red;
			background-color: lightcoral;
		}
	</style>
</head>


<body id="body">
	<aside id="left">
		<div id="container-green-bench"></div>
	</aside>

	<article id="center">
		<header>
			Grün
			<span id="span-green-goals"><i>X</i></span>
			:
			<span id=""><i>X</i></span>
			Blau
		</header>

		<section>
			<!-- Grün -->
			<div id="container-green-goalkeeper"></div>
			<div id="container-green-defenders"></div>
			<div id="container-green-midfielders"></div>
			<div id="container-green-strikers"></div>

			<!-- Blau -->
			<div id="container-blue-strikers"></div>
			<div id="container-blue-midfielders"></div>
			<div id="container-blue-defenders"></div>
			<div id="container-blue-goalkeeper"></div>
		</section>

		<footer>
			<div class="progress-bar-border">
				<div class="progress-bar-fill-in"></div>
			</div>
		</footer>
	</article>

	<aside id="right">
		<div id="container-blue-bench"></div>
	</aside>
</body>

<script>
	const spanGreenGoals = document.getElementById("span-green-goals");
	const spanBlueGoals = document.getElementById("spgoals");

	const containerGreenBench = document.getElementById("container-green-bench");
	const containerGreenGoalkeeper = document.getElementById("container-green-goalkeeper");
	const containerGreenDefenders = document.getElementById("container-green-defenders");
	const containerGreenMidfielders = document.getElementById("container-green-midfielders");
	const containerGreenStrikers = document.getElementById("container-green-strikers");

	const containerBlueBench = document.getElementById("container-blue-bench");
	const containerBlueGoalkeeper = document.getElementById("container-blue-goalkeeper");
	const containerBlueDefenders = document.getElementById("container-blue-defenders");
	const containerBlueMidfielders = document.getElementById("container-blue-midfielders");
	const containerBlueStrikers = document.getElementById("container-blue-strikers");
</script>

<script>
	async function fetchPlayers() {
		const resp = await fetch("/api/players");

		if (resp.status == 200) {
			const data = await resp.json("players");
			return data.players;
		} else {
			alert(`Packet to ${resp.url} failed with status: ${resp.status} ${resp.statusText}`);
		}
	}

	async function update() {
		let players = await fetchPlayers();

		resetDOM();

		if (players == undefined)
			return;

		players.forEach(player => {
			let playerCard = createPlayerCard(player);

			if (player.team == "blau") {
				switch (player.role) {
					case "BENCH":
						containerBlueBench.insertBefore(playerCard, containerBlueBench.childNodes[player.position]);
						break;
					case "GOALKEEPER":
						containerBlueGoalkeeper.insertBefore(playerCard, containerBlueGoalkeeper.childNodes[player.position]);
						break;
					case "DEFENDERS":
						containerBlueDefenders.insertBefore(playerCard, containerBlueDefenders.childNodes[player.position]);
						break;
					case "MIDFIELDERS":
						containerBlueMidfielders.insertBefore(playerCard, containerBlueMidfielders.childNodes[player.position]);
						break;
					case "STRIKERS":
						containerBlueStrikers.insertBefore(playerCard, containerBlueStrikers.childNodes[player.position]);
						break;

					default:
						alert(`Player ${player.name} with role ${player.role} could not be sorted correctly.`);
						break;
				}
			} else if (player.team == "grün") {
				switch (player.role) {
					case "BENCH":
						containerGreenBench.insertBefore(playerCard, containerGreenBench.childNodes[player.position]);
						break;
					case "GOALKEEPER":
						containerGreenGoalkeeper.insertBefore(playerCard, containerGreenGoalkeeper.childNodes[player.position]);
						break;
					case "DEFENDERS":
						containerGreenDefenders.insertBefore(playerCard, containerGreenDefenders.childNodes[player.position]);
						break;
					case "MIDFIELDERS":
						containerGreenMidfielders.insertBefore(playerCard, containerGreenMidfielders.childNodes[player.position]);
						break;
					case "STRIKERS":
						containerGreenStrikers.insertBefore(playerCard, containerGreenStrikers.childNodes[player.position]);
						break;

					default:
						alert(`Player ${player.name} with role ${player.role} could not be sorted correctly.`);
						break;
				}
			} else {
				alert(`Player ${player.name} with role ${player.role} could not be sorted correctly.`)
			}
		});
	}

	window.onload = (() => {
		update();
		setInterval(update, 15000);
	})();
</script>

<script>
	function createPlayerCard(player) {
		let card = document.createElement("div");
		let name = document.createElement("span");
		let timer = document.createElement("span");

		card.id = player.id
		name.innerText = player.name;
		timer.style = "display: none;";
		timer.innerText =
			`${Math.floor(player.punishment_time / 60)}m ` +
			`${Math.floor(player.punishment_time % 60)}s`;

		card.classList.add("player");

		if (player.punishment_time > 0) {
			if (player.punishment == "RED" || player.punishment == "DOUBLE")
				card.classList.add("red");
			else if (player.punishment == "YELLOW")
				card.classList.add("yellow");

			timer.style = "display: block;";
		}

		card.appendChild(name);
		card.appendChild(timer);

		return card;
	}

	function resetDOM() {
		containerGreenBench.innerHTML = "";
		containerGreenGoalkeeper.innerHTML = "";
		containerGreenDefenders.innerHTML = "";
		containerGreenMidfielders.innerHTML = "";
		containerGreenStrikers.innerHTML = "";
		containerBlueBench.innerHTML = "";
		containerBlueGoalkeeper.innerHTML = "";
		containerBlueDefenders.innerHTML = "";
		containerBlueMidfielders.innerHTML = "";
		containerBlueStrikers.innerHTML = "";
	}
</script>

<script>
	const body = document.getElementById("body");

	const left = document.getElementById("left");
	const right = document.getElementById("right");
	const center = document.getElementById("center");

	left.addEventListener("click", () => {
		body.classList.remove("focus-right");
		body.classList.add("focus-left");
	});

	center.addEventListener("click", () => {
		body.classList.remove("focus-right");
		body.classList.remove("focus-left");
	})

	right.addEventListener("click", () => {
		body.classList.remove("focus-left");
		body.classList.add("focus-right");
	});
</script>

</html>
