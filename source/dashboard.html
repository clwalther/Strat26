<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Strategiespiel 2026 - Dashboard</title>

	<link rel="icon" href="data:,">

	<style>
		html {
			overflow: hidden;
			scrollbar-width: none;
		}

		body {
			position: relative;

			height: 100vh;
			width: 100vw;

			margin: 0;

			display: flex;
			align-items: center;

			gap: 32px;

			overflow: hidden;

			font-family: Arial, Helvetica, sans-serif;
			font-size: 13px;
		}

		body::after {
			content: "";
			position: absolute;
			top: -250%;
			left: -250%;
			z-index: -2;

			background-image: url(../assets/background.png);
			background-size: 100px;

			transform: rotate(25deg);

			width: 500%;
			height: 500%;
		}

		body>aside {
			flex: 0 1 300px;

			min-width: fit-content;
			height: calc(100% - 10px);

			cursor: pointer;

			transition: flex 300ms ease, width 300ms ease, opacity 300ms ease;
		}

		body>aside#left {
			display: flex;
			justify-content: end;
			align-items: center;
		}

		body>aside#right {
			display: flex;
			justify-content: start;
			align-items: center;
		}

		body.focus-left>aside#right {
			display: none;
		}

		body.focus-left>aside#left {
			flex: 1 1 50%;
		}

		body.focus-left>aside#center {
			flex: 1 1 50%;
		}

		body.focus-right>aside#left {
			display: none;
		}

		body.focus-right>aside#right {
			flex: 1 1 50%;
		}

		body.focus-right>aside#center {
			flex: 1 1 50%;
		}

		body>aside>div {
			width: 230px;

			padding: 2px;
			padding-left: 4px;
			padding-right: 4px;
			border-radius: 10px;

			background: url(../assets/border.png);
			background-size: 500px;
			background-position: center;
		}

		body>article {
			display: grid;
			justify-items: center;

			flex: 1 1 50%;

			min-width: 500px;
			height: calc(100% - 26px - 26px);

			padding-top: 26px;
			padding-bottom: 26px;

			cursor: pointer;

			transition: flex 300ms ease, width 300ms ease;
		}

		body>article>div {
			display: grid;
			justify-items: center;
			align-content: space-between;

			height: 100%;
			width: 100%;
		}

		body.focus-right>article>div {
			width: 200%;
			translate: -25%;
		}

		body.focus-left>article>div {
			width: 200%;
			translate: 25%;
		}

		body>article>div>section {
			width: 100%;
			height: calc(100vh - 240px);

			background-image: url(../assets/pitch.jpg);
			background-position: center;
			background-size: contain;
			background-repeat: no-repeat;
		}

		body>article>div>section>div {
			display: none;
		}
	</style>

	<style>
		body>article>section>div>.player {
			height: 70px;
			width: 75px;

			margin: 2px;
			border: 2px solid black;

			display: grid;

			align-content: space-evenly;
			justify-items: center;
			text-align: center;


			overflow: hidden;
			font-size: 10px;
		}

		body>aside>div>.player {
			height: 36px;
			width: 230px;

			margin-top: 2px;
			margin-bottom: 2px;

			border-radius: 8px;

			color: white;
			background-color: black;

			display: inline-flex;
			justify-content: space-between;
			align-items: center;
		}

		/* body>aside#left>div>.player {
			background-color: #1f8e4b;
		}

		body>aside#right>div>.player {
			background-color: #403dbc;
		} */

		body>aside>div>.player>span {
			margin-left: 20px;
			margin-right: 20px;

			font-weight: 700;
		}

		body>aside>div>.player>span>b {
			border-radius: 5px;
			height: 19px;
			width: 22px;
			display: inline-block;
			text-align: center;
			margin-right: 12px;
		}

		body>aside#left>div>.player>span>b {
			background-color: #3c993c;
		}

		body>aside#right>div>.player>span>b {
			background-color: #2c2ca6;
		}
	</style>

	<style>
		header {
			position: relative;

			min-width: 400px;
			width: 50%;
			height: 60px;

			border-radius: 18px;

			display: flex;
			justify-content: space-evenly;
			align-items: center;

			color: white;
			background-color: black;

			font-size: 18px;
			font-weight: 900;
		}

		header::before {
			content: "";
			position: absolute;
			z-index: -1;

			height: 100%;
			width: 100%;

			padding: 4px;
			border-radius: 22px;

			background: url(../assets/border.png);
			background-position-x: 0%;
			background-position-y: 0%;
			background-size: auto;
			background-size: 408px;
			background-position-x: 0px;
			background-position-y: 482px;
		}

		header>span {
			height: 145%;
			width: 70px;
			border-radius: 22px;
			display: flex;
			justify-content: center;
			align-items: center;
			font-size: 29px;
		}

		header>span:first-child {
			background-image: url(../assets/green.jfif);
			background-position-x: -7px;
			background-size: 180px;
			background-position-y: -3px;
		}

		header>span:last-child {
			background-image: url(../assets/blue.jfif);
			background-position-x: -7px;
			background-size: 180px;
			background-position-y: -3px;
		}

		footer {
			position: relative;

			width: calc(100% - 8px);
			height: 60px;

			display: flex;
			justify-content: space-evenly;
			align-items: center;

			border-radius: 18px;

			background-color: black;
			color: white;
		}

		footer::before {
			content: "";
			position: absolute;
			z-index: -1;

			height: 100%;
			width: 100%;

			padding: 4px;
			border-radius: 22px;

			background: url(../assets/border.png);
			background-position-x: 0%;
			background-position-y: 0%;
			background-size: auto;
			background-size: 100%;
			background-position-x: 0px;
			background-position-y: -100px;
		}

		footer>div {
			height: calc(100% - 40px);
			width: calc(100% - 40px);

			border: 2px solid #494949;
			border-radius: 20px;

			background-image: url(../assets/blue.jfif);
			background-position: start;
			background-size: 120px;
		}

		footer>div>div {
			height: 100%;
			width: 50%;

			border-radius: 10px;

			background-image: url(../assets/green.jfif);
			background-position: start;
			background-size: 120px;

			display: flex;
			justify-content: end;

			transition: width .5s ease-in-out;
		}

		footer>div>div>img {
			position: relative;
			top: -43px;
			left: 39px;

			height: 110px;
		}
	</style>
</head>


<body id="body">
	<aside id="left">
		<div id="container-green-bench"></div>
	</aside>

	<article id="center">
		<div>
			<header>
				GRÜN
				<span id="span-green-goals"><i>X</i></span>
				:
				<span id=""><i>X</i></span>
				BLAU
			</header>

			<section>
				<!-- Grün -->
				<div id="container-green-goalkeeper"></div>
				<div id="container-green-defenders"></div>
				<div id="container-green-midfielders"></div>
				<div id="container-green-strikers"></div>

				<!-- Blau -->
				<div id="container-blue-strikers"></div>
				<div id="container-blue-midfielders"></div>
				<div id="container-blue-defenders"></div>
				<div id="container-blue-goalkeeper"></div>
			</section>

			<footer>
				<div class="progress-bar-border">
					<div class="progress-bar-fill-in">
						<img src="../assets/football.png" alt="">
					</div>
				</div>
			</footer>
		</div>
	</article>

	<aside id="right">
		<div id="container-blue-bench"></div>
	</aside>
</body>

<script>
	const spanGreenGoals = document.getElementById("span-green-goals");
	const spanBlueGoals = document.getElementById("spgoals");

	const containerGreenBench = document.getElementById("container-green-bench");
	const containerGreenGoalkeeper = document.getElementById("container-green-goalkeeper");
	const containerGreenDefenders = document.getElementById("container-green-defenders");
	const containerGreenMidfielders = document.getElementById("container-green-midfielders");
	const containerGreenStrikers = document.getElementById("container-green-strikers");

	const containerBlueBench = document.getElementById("container-blue-bench");
	const containerBlueGoalkeeper = document.getElementById("container-blue-goalkeeper");
	const containerBlueDefenders = document.getElementById("container-blue-defenders");
	const containerBlueMidfielders = document.getElementById("container-blue-midfielders");
	const containerBlueStrikers = document.getElementById("container-blue-strikers");
</script>

<script>
	async function fetchPlayers() {
		const resp = await fetch("/api/players");

		if (resp.status == 200) {
			const data = await resp.json("players");
			return data.players;
		} else {
			alert(`Packet to ${resp.url} failed with status: ${resp.status} ${resp.statusText}`);
		}
	}

	async function update() {
		let players = await fetchPlayers();

		resetDOM();

		if (players == undefined)
			return;

		players.forEach(player => {
			let playerCard = createPlayerCard(player);

			if (player.team == "blau") {
				switch (player.role) {
					case "BENCH":
						containerBlueBench.insertBefore(playerCard, containerBlueBench.childNodes[player.position]);
						break;
					case "GOALKEEPER":
						containerBlueGoalkeeper.insertBefore(playerCard, containerBlueGoalkeeper.childNodes[player.position]);
						break;
					case "DEFENDERS":
						containerBlueDefenders.insertBefore(playerCard, containerBlueDefenders.childNodes[player.position]);
						break;
					case "MIDFIELDERS":
						containerBlueMidfielders.insertBefore(playerCard, containerBlueMidfielders.childNodes[player.position]);
						break;
					case "STRIKERS":
						containerBlueStrikers.insertBefore(playerCard, containerBlueStrikers.childNodes[player.position]);
						break;

					default:
						alert(`Player ${player.name} with role ${player.role} could not be sorted correctly.`);
						break;
				}
			} else if (player.team == "grün") {
				switch (player.role) {
					case "BENCH":
						containerGreenBench.insertBefore(playerCard, containerGreenBench.childNodes[player.position]);
						break;
					case "GOALKEEPER":
						containerGreenGoalkeeper.insertBefore(playerCard, containerGreenGoalkeeper.childNodes[player.position]);
						break;
					case "DEFENDERS":
						containerGreenDefenders.insertBefore(playerCard, containerGreenDefenders.childNodes[player.position]);
						break;
					case "MIDFIELDERS":
						containerGreenMidfielders.insertBefore(playerCard, containerGreenMidfielders.childNodes[player.position]);
						break;
					case "STRIKERS":
						containerGreenStrikers.insertBefore(playerCard, containerGreenStrikers.childNodes[player.position]);
						break;

					default:
						alert(`Player ${player.name} with role ${player.role} could not be sorted correctly.`);
						break;
				}
			} else {
				alert(`Player ${player.name} with role ${player.role} could not be sorted correctly.`)
			}
		});
	}

	window.onload = (() => {
		update();
		// setInterval(update, 15000);
	})();
</script>

<script>
	function createPlayerCard(player) {
		let card = document.createElement("div");
		let name = document.createElement("span");
		let fatigue = document.createElement("span");

		name.appendChild(fatigue)

		card.id = player.id
		name.innerHTML = `<b>${Math.floor(Math.min(100 - player.fatigue, 99))}</b>${player.name.toUpperCase()}`;

		card.classList.add("player");

		if (player.punishment_time > 0) {
			if (player.punishment == "RED" || player.punishment == "DOUBLE")
				card.classList.add("red");
			else if (player.punishment == "YELLOW")
				card.classList.add("yellow");

			fatigue.style = "display: block;";
		}

		card.appendChild(name);

		return card;
	}

	function resetDOM() {
		containerGreenBench.innerHTML = "";
		containerGreenGoalkeeper.innerHTML = "";
		containerGreenDefenders.innerHTML = "";
		containerGreenMidfielders.innerHTML = "";
		containerGreenStrikers.innerHTML = "";
		containerBlueBench.innerHTML = "";
		containerBlueGoalkeeper.innerHTML = "";
		containerBlueDefenders.innerHTML = "";
		containerBlueMidfielders.innerHTML = "";
		containerBlueStrikers.innerHTML = "";
	}
</script>

<script>
	const body = document.getElementById("body");

	const left = document.getElementById("left");
	const right = document.getElementById("right");
	const center = document.getElementById("center");

	left.addEventListener("click", () => {
		body.classList.remove("focus-right");
		body.classList.add("focus-left");
	});

	center.addEventListener("click", () => {
		body.classList.remove("focus-right");
		body.classList.remove("focus-left");
	})

	right.addEventListener("click", () => {
		body.classList.remove("focus-left");
		body.classList.add("focus-right");
	});
</script>

</html>
